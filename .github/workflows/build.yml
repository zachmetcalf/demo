name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset demo-windows

      - name: Build - Debug
        run: cmake --build --preset debug-windows

      - name: Build - Release
        run: cmake --build --preset release-windows

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset demo-linux

      - name: Build - Debug
        run: cmake --build --preset debug-linux

      - name: Build - Release
        run: cmake --build --preset release-linux
