name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset demo-windows

      - name: Compile - Debug
        run: cmake --build --preset debug-windows

      - name: Compile - Release
        run: cmake --build --preset release-windows

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset demo-linux

      - name: Compile - Debug
        run: cmake --build --preset debug-linux

      - name: Compile - Release
        run: cmake --build --preset release-linux
